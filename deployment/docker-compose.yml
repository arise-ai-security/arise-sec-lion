# Arise Sec Lion
#
# Usage:
#   docker compose --profile local up -d           # Start local dev (with local DB)
#   docker compose --profile dev up -d             # Start dev (Supabase DB, no local DB)
#   docker compose --profile prod up -d            # Start production
#   docker compose --profile test up -d            # Start test DB only

services:
  # --- Local profile (local PostgreSQL) ---
  api:
    profiles: [local]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: development
    container_name: arise-api
    volumes:
      - ..:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ARISE_INFRA_POSTGRES_HOST: db
    ports:
      - "8000:8000"
    command: uvicorn query.api.bootstrap:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: [local]
    init: true  # Use tini to reap zombie processes
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: development
    container_name: arise-app
    volumes:
      - ..:/app
      - /app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
      - ../output:/app/output  # Bind mount for host-container sync
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ARISE_INFRA_POSTGRES_HOST: db
      DOCKER_HOST: unix:///var/run/docker.sock  # Enable DooD for SEC-bench workers
    command: sleep infinity
    stdin_open: true
    tty: true

  db:
    profiles: [local]
    image: postgres:16-alpine
    container_name: arise-db
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../infrastructure/sql/create_events_table.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-arise_events}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arise} -d ${POSTGRES_DB:-arise_events}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Dev profile (Supabase external DB) ---
  api-dev:
    profiles: [dev]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: development
    container_name: arise-api-dev
    volumes:
      - ..:/app
      - /app/.venv
    env_file: .env.dev
    ports:
      - "8000:8000"
    command: uvicorn query.api.bootstrap:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-dev:
    profiles: [dev]
    init: true  # Use tini to reap zombie processes
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: development
    container_name: arise-app-dev
    volumes:
      - ..:/app
      - /app/.venv
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/home/appuser/.claude  # Mount local Claude config (API key + debug logs)
      - ../output:/app/output  # Bind mount for host-container sync
    env_file: .env.dev
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock  # Enable DooD for SEC-bench workers
    command: sleep infinity
    stdin_open: true
    tty: true

  # --- Production profile ---
  app-prod:
    profiles: [prod]
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: production
    container_name: arise-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      ARISE_INFRA_POSTGRES_HOST: db

  # --- Test profile ---
  test-db:
    profiles: [test]
    image: postgres:16-alpine
    container_name: arise-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../infrastructure/sql/create_events_table.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
