# =============================================================================
# Production Docker Compose - Arise Multi-Agent System
# =============================================================================
# Usage:
#   cp .env.prod.example .env.prod  # Configure production settings
#   docker compose -f docker-compose.prod.yml up -d

services:
  # ---------------------------------------------------------------------------
  # Application Service (Production)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: production
    container_name: arise-app-prod
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    networks:
      - arise-network
    # For web API (future):
    # ports:
    #   - "8000:8000"

  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Production)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: arise-db-prod
    restart: unless-stopped
    env_file: .env
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ../infrastructure/sql/create_events_table.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arise-network
    # Don't expose port in production - only internal access
    # ports:
    #   - "5432:5432"

networks:
  arise-network:
    driver: bridge

volumes:
  prod_postgres_data:
