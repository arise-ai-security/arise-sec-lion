# Default Configuration for Arise Multi-Agent System
# This file contains sensible defaults for all environments

infrastructure:
  # PostgreSQL Event Store
  postgres_host: localhost
  postgres_port: 5432
  postgres_user: arise
  postgres_database: arise_events
  # NOTE: Set ARISE_INFRA_POSTGRES_PASSWORD via environment variable!

  # LLM Configuration (Role-based Model Selection)
  # Each agent role uses a different model based on complexity and cost:
  # - BOSS: High-level planning (powerful model)
  # - MANAGER: Task decomposition (balanced model)
  # - WORKER: Simple execution (cheap, fast model)
  # - PENDING: Complexity evaluation (cheap model)
  #
  # API keys are read from environment variables (OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.)
  #
  # Model Examples:
  #   OpenAI:     gpt-4o-mini, gpt-4o, gpt-4-turbo
  #   Anthropic:  claude-3-5-sonnet-20241022, claude-3-opus-20240229
  #   Google:     gemini-1.5-pro, gemini-1.5-flash, gemini-pro
  #
  llm_model_boss: gpt-4o        # Powerful model for high-level planning
  llm_model_manager: gpt-4o      # Balanced model for decomposition
  llm_model_worker: gpt-4o-mini  # Fast, cheap model for execution
  llm_model_pending: gpt-4o-mini # Cheap model for complexity checks
  llm_temperature: 0.7
  llm_max_tokens: 1000

  # Worker Tool Configuration
  # Supported types: "claude_code" or "openhands"
  #
  # claude_code: Uses Claude Code CLI (requires ANTHROPIC_API_KEY)
  #   - Best for: Users with Anthropic API access
  #   - Requires: claude CLI installed, ANTHROPIC_API_KEY env var
  #
  # openhands: Uses OpenHands SDK (supports any LLM provider)
  #   - Best for: Users with OpenAI or other LLM provider access
  #   - Requires: openhands-sdk installed, OPENAI_API_KEY or LLM_API_KEY env var
  #   - Model: Configurable via worker_tool_model (default: openai/gpt-4o)
  #
  worker_tool_type: openhands
  worker_tool_model: openai/gpt-4o  # Only used for openhands (LiteLLM format)
  worker_tool_timeout: 300  # seconds

application:
  # Optimistic Concurrency Control
  max_retries: 3
  retry_delay: 0.1  # seconds

  # Orchestration Loop
  poll_interval: 0.5  # seconds

  # Timeouts
  llm_timeout: 30.0  # seconds
  worker_timeout: 300.0  # seconds

  # Agent Configuration
  default_task_complexity_threshold: 5

presentation:
  verbose: true
  show_progress: true
  log_level: INFO
  output_directory: ./output  # Directory for generated code and exports
