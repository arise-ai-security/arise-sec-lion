# Production Configuration
# Optimized for reliability, performance, and observability

infrastructure:
  # PostgreSQL (use environment variables for credentials!)
  postgres_host: ${POSTGRES_HOST:-db.production.internal}
  postgres_port: 5432
  postgres_user: arise_prod
  postgres_database: arise_events_prod
  # Set via env: ARISE_INFRA_POSTGRES_PASSWORD

  # LLM Configuration
  # Only the root BOSS agent uses this setting. Child agents are configured
  # dynamically at runtime by their parents via LLM reasoning.
  #
  # API keys are read from environment variables (OPENAI_API_KEY, ANTHROPIC_API_KEY, etc.)
  #
  # Examples:
  #   Claude Sonnet:  claude-3-5-sonnet-20241022  (requires ANTHROPIC_API_KEY)
  #   GPT-4o:         gpt-4o                       (requires OPENAI_API_KEY)
  #   Gemini Pro:     gemini-1.5-pro               (requires GEMINI_API_KEY)
  #
  llm_model_boss: claude-3-5-sonnet-20241022  # Powerful model for high-level planning

  worker_tool_type: claude_code

application:
  # Optimistic Concurrency Control
  max_retries: 5  # More retries for resilience
  retry_delay: 0.2  # Longer delay to avoid thundering herd

  # Orchestration Loop
  poll_interval: 1.0  # Slower polling to reduce DB load

  # Timeouts
  llm_timeout: 60.0  # Longer timeout for complex queries
  worker_timeout: 600.0  # 10 minutes for worker tasks

  # Agent Configuration
  default_task_complexity_threshold: 7  # Higher threshold = fewer splits

presentation:
  verbose: false  # Minimal output in production
  show_progress: false  # No progress bars in production logs
  log_level: WARNING  # Only warnings and errors
