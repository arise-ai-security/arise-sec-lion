# Cell B2: tree with SecBenchPromptStrategy (SEC-bench domain prompts ON).
#
# Consumed by `python main.py -c config/exp-secbench-B2.yaml run ...`. Mirrors
# B1 except for the prompt_strategy, which selects SecBenchPromptStrategy.
database:
  host: localhost
  port: 5432
  user: arise
  name: arise_events

boss:
  model: claude-opus-4-7
  max_tokens: 4000

manager:
  model: claude-opus-4-7
  max_tokens: 4000

worker:
  model: claude-sonnet-4-6
  tool: claude_code   # switched from openhands for this experiment
  timeout: 600
  max_iterations_per_run: 40

orchestration:
  max_retries: 2
  poll_interval: 0.5
  max_run_duration_seconds: 600
  max_redecompositions: 1
  skip_judge: true
  topology:
    max_depth: 2
    max_children_per_node: 5
    max_total_agents: 15
  concurrency:
    max_concurrent_workers: 1
    max_concurrent_llm_calls: 1
    llm_jitter_max_ms: 0

security:
  enabled: true
  tools: [valgrind, klee]
  prompt_strategy: "default"   # SecBenchPromptStrategy

output:
  verbose: true
  show_progress: true
  log_level: INFO
  directory: ./output
