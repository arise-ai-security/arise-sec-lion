# Cell B2: tree with SecBenchPromptStrategy (SEC-bench domain prompts ON).
#
# Consumed by `python main.py -c config/exp-secbench-B2.yaml run ...`. Mirrors
# B1 except for the prompt_strategy, which selects SecBenchPromptStrategy.
database:
  host: localhost
  port: 5432
  user: arise
  name: arise_events

boss:
  model: claude-opus-4-7
  # 16000: SecBench 4-phase decomposition (Builder/Exploiter/Fixer/Reporter with
  # multi-paragraph justifications) truncates at 4000; matches base config.yaml.
  max_tokens: 16000

manager:
  model: claude-sonnet-4-6   # v2: was claude-opus-4-7; Sonnet for cheaper mid-tier reasoning
  max_tokens: 8000

worker:
  model: claude-sonnet-4-6
  tool: claude_code   # switched from openhands for this experiment
  timeout: 600
  max_iterations_per_run: 20   # v3 budget-tighten: was 40; caps runaway worker_stuck cost

orchestration:
  max_retries: 2
  poll_interval: 0.5
  max_run_duration_seconds: 2700   # v3 budget-tighten: was 5400; halves worst-case wallclock
  max_redecompositions: 1
  skip_judge: true
  topology:
    max_depth: 5                # v2: was 2 — allow MANAGER layer at depth 1 + further sub-decomposition
    max_children_per_node: 8    # v2: was 5
    max_total_agents: 10000     # v2: was 15 — effectively unbounded; budget/wallclock + shape caps are the real ceiling
  concurrency:
    max_concurrent_workers: 1   # unchanged — sequential execution
    max_concurrent_llm_calls: 1
    llm_jitter_max_ms: 0

security:
  enabled: true
  tools: [valgrind, klee]
  prompt_strategy: "default"   # SecBenchPromptStrategy

output:
  verbose: true
  show_progress: true
  log_level: INFO
  directory: ./output
