database:
  host: localhost
  port: 5432
  user: arise
  name: arise_events

# LLM provider: Alibaba Cloud Model Studio (OpenAI-compatible endpoint).
# API key is read from OPENAI_API_KEY env var (see deployment/.env).
# Region endpoints:
#   Singapore:        https://dashscope-intl.aliyuncs.com/compatible-mode/v1
#   US (Virginia):    https://dashscope-us.aliyuncs.com/compatible-mode/v1
#   China (Beijing):  https://dashscope.aliyuncs.com/compatible-mode/v1
#   China (HK):       https://cn-hongkong.dashscope.aliyuncs.com/compatible-mode/v1
# Current model: qwen3.5:397b (matches the Ollama Cloud model that was
# tested previously; verify exact SKU name in Alibaba Cloud console — if
# 400 model-not-found, try alternative dash format: qwen3.5-397b).
# Other available models (cheaper to flagship): qwen-turbo, qwen-plus,
# qwen-max, qwen3-max, qwen3-235b-a22b-instruct.
#
# CAVEAT: qwen3-series models may have thinking enabled by default on
# DashScope. The codebase strips <think> tags downstream but still pays
# for those output tokens. If output costs come back inflated, either
# (a) switch to qwen-plus / qwen-turbo (no thinking), or (b) add a small
# override in litellm_adapter.py to pass extra_body={enable_thinking: false}.

boss:
  model: openai/qwen3.5-397b-a17b
  api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  max_tokens: 16000  # Needs enough tokens for subtask JSON arrays + recon tool responses

manager:
  model: openai/qwen3.5-397b-a17b
  api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  max_tokens: 16000  # Needs enough tokens for subtask JSON arrays + recon tool responses

worker:
  model: openai/qwen3.5-397b-a17b
  base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  tool: openhands
  timeout: 1500
  max_iterations_per_run: 20

# Output-format repairer: second-tier LLM-backed JSON parser. Only invoked
# when the deterministic raw_decode/_repair_json chain fails. Distinct
# from the security-domain "Fixer" agent role.
#
# OPT-IN: disabled by default. Set enabled: true when running on models
# prone to malformed output (qwen3.5, qwen3, deepseek, GLM, unknown).
# qwen3-coder-plus is Alibaba's coder-tuned model (alias for
# qwen3-coder-480b-a35b-instruct) — strict JSON output, no thinking-mode
# pollution. If unavailable in your workspace, fall back to qwen-plus.
format_repairer:
  enabled: true
  model: openai/qwen3-coder-next
  api_base: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  max_tokens: 16000

orchestration:
  max_retries: 3
  poll_interval: 0.5  # seconds between orchestration loop iterations
  # Aggressive watchdog defaults to reduce long “looks stuck” windows.
  step_timeout_seconds: 420
  worker_silence_timeout_seconds: 600  # p99 max gap for successful workers; 300s killed 2.9% of completable workers
  # More headroom for large Alibaba-hosted models to emit first token.
  no_progress_grace_seconds: 240
  no_progress_initial_grace_seconds: 300
  no_progress_check_interval: 20
  pending_assessment_timeout_seconds: 180
  max_run_duration_seconds: 10800  # hard stop for the full orchestration run (3 hrs, 1.5x for Qwen)
  max_redecompositions: 2  # per-parent limit for infeasibility-driven re-planning
  # skip_judge: false  # set true to skip LLM judge verification (stages 1-3 still run)

  topology:
    max_depth: 3               # BOSS(0) → children(1) → grandchildren(2) → forced-workers(3)
    max_children_per_node: 7   # Deeper levels produce more fine-grained workers (3-5 per node)
    max_total_agents: 60       # Qwen decomposes more aggressively than GPT (~6 workers/manager)

  concurrency:
    max_concurrent_workers: 1  # Sequential execution so sibling context is populated
    max_concurrent_llm_calls: 1   # Sequential for deterministic traceability
    llm_jitter_max_ms: 0       # Max random jitter before LLM calls in ms (0 = disabled)

  retry:
    # Model escalation chain controls generic worker retries. Leave empty to
    # disable model-escalation retries.
    model_escalation_chain: []
    circuit_breaker_threshold: 3
    circuit_breaker_reset_seconds: 300
    # Dedicated budget for workers that started execution but emitted zero thoughts.
    # Independent of model_escalation_chain length.
    no_progress_max_retries: 2
    step_timeout_max_retries: 2
    silent_worker_max_retries: 2
    pending_assessment_max_retries: 2
    provider_reconnect_max_retries: 1

  tool_calling:
    # Iterations control how many tool-calling rounds an agent gets.
    # Context management layers (truncation, condensation, budget gate)
    # prevent overflow, so the cap can be raised safely.
    max_iterations: 5

    # Context condensation for tool-calling loop.
    # Layer 1: hard-cap each tool result (chars). Prevents single results
    #   from dominating the context window.
    result_char_limit: 6000
    # Layer 2: after this many iterations, older tool exchanges are
    #   LLM-summarized into a compact digest (keeps recent results verbatim).
    condense_after_iteration: 2
    # Layer 3: estimated token ceiling. If exceeded, force-stop the loop
    #   and produce a final answer with whatever info has been gathered.
    token_budget: 80000

    # Per-role and per-domain tool-calling policy overrides.
    # Merged: domain-specific > role default > hardcoded fallback.
    policies:
      default:
        pending:
          max_iterations: 5
          result_char_limit: 6000
          toolsets:
            recon:
              enabled: false
        manager:
          max_iterations: 5
          result_char_limit: 6000
          toolsets:
            recon:
              enabled: false
        boss:
          toolsets:
            recon:
              enabled: false   # BOSS recon deferred — separate concern
      domains:
        secbench:
          boss:
            max_iterations: 3
            toolsets:
              recon:
                allowed_tools:
                  - search_codebase
                  - read_file
                  - get_file_structure
                  - get_symbols_overview
                  - read_symbol
          pending:
            max_iterations: 3
            toolsets:
              recon:
                allowed_tools:
                  - search_codebase
                  - read_file
                  - get_file_structure
                  - get_symbols_overview
                  - read_symbol
          manager:
            max_iterations: 3
            toolsets:
              recon:
                allowed_tools:
                  - search_codebase
                  - read_file
                  - get_file_structure
                  - get_symbols_overview
                  - read_symbol

output:
  verbose: true
  show_progress: true
  log_level: INFO
  directory: ./output

# CORS (Cross-Origin Resource Sharing) settings
cors:
  allowed_origins:
    - "http://localhost:5173"  # Vite dev server
    - "http://localhost:3000"  # Alternative React dev port
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "*"
  allow_credentials: true

# SEC-bench container settings
security:
  enabled: true  # Uses worker.timeout for secb commands
  tools: [valgrind]  # KLEE unavailable in Ubuntu Focal base images
