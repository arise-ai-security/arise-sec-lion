database:
  host: localhost
  port: 5432
  user: arise
  name: arise_events

boss:
  model: gpt-4o-mini
  temperature: 0.5
  max_tokens: 4000  # Needs enough tokens for subtask JSON arrays

manager:
  model: gpt-4o-mini
  temperature: 0.5
  max_tokens: 4000  # Needs enough tokens for subtask JSON arrays

worker:
  model: claude-sonnet-4-20250514
  tool: claude_code
  timeout: 120

orchestration:
  max_retries: 3
  poll_interval: 0.5  # seconds between orchestration loop iterations

  limits:
    max_depth: 4               # Force workers at depth 4
    max_children_per_node: 8   # Allow enough subtasks for validation workers
    max_total_agents: 50       # Safety limit on total agents
    max_concurrent_workers: -1 # -1 = unlimited
    llm_rate_limit_rpm: -1     # -1 = unlimited
    max_concurrent_llm_calls: 10  # Concurrent LLM API calls (-1 = unlimited)
    llm_jitter_max_ms: 0       # Max random jitter before LLM calls in ms (0 = disabled)

output:
  verbose: true
  show_progress: true
  log_level: INFO
  directory: ./output

# CORS (Cross-Origin Resource Sharing) settings
cors:
  allowed_origins:
    - "http://localhost:5173"  # Vite dev server
    - "http://localhost:3000"  # Alternative React dev port
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "*"
  allow_credentials: true

# SEC-bench container settings
security:
  enabled: true  # Uses worker.timeout for secb commands
