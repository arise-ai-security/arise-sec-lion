database:
  host: localhost
  port: 5432
  user: arise
  name: arise_events

boss:
  model: gpt-4o-mini
  temperature: 0.5
  max_tokens: 4000  # Needs enough tokens for subtask JSON arrays

manager:
  model: gpt-4o-mini
  temperature: 0.5
  max_tokens: 4000  # Needs enough tokens for subtask JSON arrays

worker:
  model: openai/gpt-4o
  tool: openhands
  timeout: 600

orchestration:
  max_retries: 3
  poll_interval: 0.5  # seconds between orchestration loop iterations

  limits:
    max_depth: 3               # BOSS(0) → children(1) → grandchildren(2) → forced-workers(3)
    max_children_per_node: 5   # SEC-bench manager templates instruct LLM to produce 4-5 subtasks
    max_total_agents: 25       # Safety cap for demo run (accommodates deeper trees)
    max_concurrent_workers: 1  # Sequential execution so sibling context is populated
    llm_rate_limit_rpm: -1     # -1 = unlimited
    max_concurrent_llm_calls: 1   # Sequential for deterministic traceability
    llm_jitter_max_ms: 0       # Max random jitter before LLM calls in ms (0 = disabled)
    # Recon iterations control how many tool-calling rounds a PENDING agent
    # gets before deciding execute vs decompose.  Context management layers
    # (truncation, condensation, budget gate) now prevent overflow, so the
    # iteration cap can be raised from the previous defensive value of 2.
    max_recon_iterations: 5

    # Context condensation for recon tool-calling loop.
    # Layer 1: hard-cap each tool result (chars). Prevents single results
    #   from dominating the context window.
    recon_result_char_limit: 6000
    # Layer 2: after this many iterations, older tool exchanges are
    #   LLM-summarized into a compact digest (keeps recent results verbatim).
    recon_condense_after_iteration: 2
    # Layer 3: estimated token ceiling. If exceeded, force-stop the loop
    #   and produce a final answer with whatever info has been gathered.
    recon_token_budget: 80000

  # Per-role and per-domain recon policy overrides.
  # Merged: domain-specific > role default > hardcoded fallback.
  recon:
    default:
      pending:
        enabled: true
        max_iterations: 5
        result_char_limit: 6000
      manager:
        enabled: true
        max_iterations: 5
        result_char_limit: 6000
      boss:
        enabled: false   # BOSS recon deferred — separate concern
    domains:
      secbench:
        manager:
          max_iterations: 3
          allowed_tools:
            - search_codebase
            - read_file
            - get_file_structure
            - get_symbols_overview
            - read_symbol

output:
  verbose: true
  show_progress: true
  log_level: INFO
  directory: ./output

# CORS (Cross-Origin Resource Sharing) settings
cors:
  allowed_origins:
    - "http://localhost:5173"  # Vite dev server
    - "http://localhost:3000"  # Alternative React dev port
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "*"
  allow_credentials: true

# SEC-bench container settings
security:
  enabled: true  # Uses worker.timeout for secb commands
  tools: []  # Disabled: valgrind/klee not available in eval images
