database:
  host: localhost
  port: 5432
  user: arise
  name: arise_events

boss:
  model: gpt-4o-mini
  temperature: 0.5
  max_tokens: 500

manager:
  model: gpt-4o-mini
  temperature: 0.5
  max_tokens: 500

worker:
  model: claude-sonnet-4-20250514
  tool: claude_code
  timeout: 120

orchestration:
  max_retries: 3
  retry_delay: 0.1
  poll_interval: 0.05  # Reduced from 0.5s for faster scaling
  llm_timeout: 30.0
  worker_timeout: 300.0
  default_task_complexity_threshold: 5
  # Note: Budget tracking will be added via SharedExecutionContext (context-passing feature)

  limits:
    max_depth: 4               # Force workers at depth 2 (faster execution)
    max_children_per_node: 2   # Limit subtasks per decomposition (faster)
    max_total_agents: 15       # Safety limit on total agents
    max_concurrent_workers: -1 # -1 = unlimited
    llm_rate_limit_rpm: -1     # -1 = unlimited
    max_concurrent_llm_calls: 10  # Concurrent LLM API calls (-1 = unlimited)
    llm_jitter_max_ms: 0       # Max random jitter before LLM calls in ms (0 = disabled)

output:
  verbose: true
  show_progress: true
  log_level: INFO
  directory: ./output

# CORS (Cross-Origin Resource Sharing) settings
cors:
  allowed_origins:
    - "http://localhost:5173"  # Vite dev server
    - "http://localhost:3000"  # Alternative React dev port
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "*"
  allow_credentials: true

# Security benchmark generation settings
security:
  enabled: true
  auto_detect: true                          # Auto-detect CVE/security tasks from keywords
  default_model_poc: gpt-4o                  # Model for PoC generation (needs creativity)
  default_model_patch: claude-3-5-sonnet-20241022  # Model for patch generation
  default_model_validation: gpt-4o-mini      # Model for validation (deterministic)
  poc_temperature: 0.6                       # Higher temp for creative exploit generation
  patch_temperature: 0.5                     # Balanced for correctness + minimal change
  validation_temperature: 0.2                # Low temp for deterministic validation
  max_poc_attempts: 3                        # Retry PoC generation this many times
  max_patch_attempts: 3                      # Retry patch generation this many times
  docker_timeout: 300                        # Timeout for Docker build/run operations
  sanitizer_flags: "-fsanitize=address,undefined -g"
