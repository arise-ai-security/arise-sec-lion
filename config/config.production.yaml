# Production environment overrides
# Merged on top of config.yaml when ARISE_ENV=production

# CORS settings for production
cors:
  allowed_origins:
    - "https://arise.example.com"      # Replace with actual production domain
    - "https://www.arise.example.com"  # Replace with www subdomain if used
  # Methods and headers inherit from base config unless overridden here
  allow_credentials: true

# Production output settings
output:
  verbose: false
  log_level: WARNING
