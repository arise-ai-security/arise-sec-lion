# Pre-commit hooks for arise-sec-lion
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: check-architecture-boundaries
        name: check architecture boundaries
        entry: python3 scripts/check_architecture_boundaries.py
        language: system
        pass_filenames: false

      - id: validate-experiment-reports
        name: validate scripts-first provenance on experiment reports
        entry: python3 -m experiments.shared.scripts.validate_reports
        language: system
        files: ^experiments/.+/reports/
        pass_filenames: true

      - id: validate-experiment-manifests
        name: validate experiment manifests
        entry: python3 -m experiments.shared.scripts.validate_manifest
        language: system
        files: ^experiments/.*/manifest\.yaml$|^experiments/shared/groups\.yaml$|^experiments/shared/runners/.*\.py$
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: mixed-line-ending
