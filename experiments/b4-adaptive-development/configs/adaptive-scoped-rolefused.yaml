# Cell B_ADAPTIVE_SCOPED_ROLEFUSED — the best adaptive+scoped config with the
# per-phase specialist roles FUSED. max_depth=2 collapses the
# BOSS -> phase controller -> selected worker chain into BOSS -> single
# phase-worker, so each phase is executed by one fused agent instead of a
# controller that spawns distinct [PoC-Researcher]/[Build-Setup]/... specialists.
# Extends the best adaptive-scoped config so it isolates the value of role
# specialization against identical adaptive routing + scoped-context settings.

extends: experiments/b4-adaptive-development/configs/adaptive-scoped.yaml

overrides:
  orchestration.treatment_version: b4-adaptive-rolefused-v1
  orchestration.topology.max_depth: 2
  orchestration.topology.max_total_agents: 12
