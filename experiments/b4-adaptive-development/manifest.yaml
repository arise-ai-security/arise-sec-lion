study_id: b4-adaptive-development
created_at: 2026-07-12T00:00:00+00:00
hypothesis: >
  Development-only fixed-model ablation of adaptive routing and scoped context.
  The inspected held-out-20 cohort is reused only for configuration selection.
  The role-fused arm holds the best adaptive+scoped config fixed and collapses
  the per-phase specialist roles into single fused phase-workers, isolating the
  value of role specialization from adaptive routing and scoped context.
dataset: ../b4-boss-manager-worker/dataset.yaml
replicates: 1
cells:
  B_FULL_GLOBAL: {group: B, runner: arise, config: configs/full-global.yaml}
  B_ADAPTIVE_GLOBAL: {group: B, runner: arise, config: configs/adaptive-global.yaml}
  B_FULL_SCOPED: {group: B, runner: arise, config: configs/full-scoped.yaml}
  B_ADAPTIVE_SCOPED: {group: B, runner: arise, config: configs/adaptive-scoped.yaml}
  B_ADAPTIVE_SCOPED_8K: {group: B, runner: arise, config: configs/adaptive-scoped-8k.yaml}
  B_ADAPTIVE_SCOPED_32K: {group: B, runner: arise, config: configs/adaptive-scoped-32k.yaml}
  B_ADAPTIVE_SCOPED_ROLEFUSED: {group: B, runner: arise, config: configs/adaptive-scoped-rolefused.yaml}
headline_cells: [B_FULL_GLOBAL, B_ADAPTIVE_GLOBAL, B_FULL_SCOPED, B_ADAPTIVE_SCOPED, B_ADAPTIVE_SCOPED_ROLEFUSED]
