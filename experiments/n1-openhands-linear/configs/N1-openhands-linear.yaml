# Cell N1 — naive OpenHands baseline, linear topology (subagents OFF).
# `orchestration.mode: flat` collapses the hierarchy into one OpenHands
# session driven by the unified entrypoint; the agent receives the same BEF
# 4-phase pipeline prompt + CVE context the B-cells use and writes the same
# /testcase deliverables. Worker tool surface matches B3/B4 workers exactly.

extends: config/config.yaml

overrides:
  orchestration.mode: flat
  orchestration.skip_judge: true   # flat mode has no judge stage; pinned for explicitness
  orchestration.max_run_duration_seconds: 14400   # CONTROL: identical across all 3 cells (non-binding for flat)
  orchestration.concurrency.max_agent_step_seconds: 3600
  boss.model: claude-sonnet-4-6     # unused in flat mode; required by the Settings schema
  manager.model: claude-sonnet-4-6  # unused in flat mode; required by the Settings schema
  worker.tool: openhands
  worker.model: gpt-5.3-codex
  worker.allowed_tools: [file_editor, glob, grep]
  # OpenHands native tools allowlisted above; terminal/browser omitted —
  # shell reaches the CVE container only via the MCP shell_in_container tool.
  worker.tool_params.openhands.mcp_tools: [shell_in_container, valgrind_run, klee_run]
  worker.tool_params.openhands.mcp_tool_timeout_seconds: 600
  worker.tool_params.openhands.enable_subagents: false
  # CONTROL: these caps are identical across N1/B3/B4 so cells differ only in
  # topology + model. N's single flat agent empirically uses ~48 iterations, so
  # 250 is non-binding for it; B workers already used 250.
  worker.timeout: 3600
  worker.max_iterations_per_run: 250
  output.directory: ./runs
