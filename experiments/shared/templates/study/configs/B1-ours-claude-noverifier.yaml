# Cell B1 — our hierarchy (boss → manager → worker) with the LLM Judge
# stage OFF. Worker model matches the A-cells so A vs B isolates the
# coordination structure under an identical worker. B1 vs B2 isolates the
# Judge contribution within the Claude-worker arm.

extends: config/config.yaml

overrides:
  orchestration.mode: hierarchical
  orchestration.skip_judge: true
  boss.model: claude-opus-4-5-20251101
  manager.model: claude-opus-4-5-20251101
  worker.tool: claude_code
  worker.model: claude-sonnet-4-5-20250929
  worker.allowed_tools: [Read, Write, Edit, MultiEdit, Bash, Glob, Grep]
  worker.disallowed_tools: [WebSearch, WebFetch]
  worker.timeout: 5400
  worker.max_iterations_per_run: 250
  output.directory: ./runs
  worker.tool_params:
    openhands: null
    claude_code:
      output_format: stream-json
      include_partial_messages: true
      max_turns: 250
      use_global_config: false
  domain.plugin: security
