# Cell C1 — our hierarchy with OpenHands-driven local Qwen worker, Judge OFF.
# Boss/Manager match B (Opus) so B vs C isolates only the worker substitution
# (Claude Sonnet → local Qwen). C1 vs C2 isolates the Judge contribution
# within the Qwen-worker arm.
#
# Requires a local Ollama daemon serving `qwen3:8b` reachable from the worker
# container; on Linux the docker-compose extra_hosts pin handles routing.

extends: config/config.yaml

overrides:
  orchestration.mode: hierarchical
  orchestration.skip_judge: true
  boss.model: claude-opus-4-5-20251101
  manager.model: claude-opus-4-5-20251101
  worker.tool: openhands
  worker.model: ollama_chat/qwen3:8b
  worker.allowed_tools: [file_editor, glob, grep, valgrind_run, klee_run]
  worker.disallowed_tools: [terminal, browser_tool_set]
  worker.timeout: 5400
  worker.max_iterations_per_run: 250
  output.directory: ./runs
  worker.tool_params:
    claude_code: null
    openhands:
      image: openhands:latest
      timeout_seconds: 5400
      max_iterations_per_run: 250
  domain.plugin: security
