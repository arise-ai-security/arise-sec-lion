hypothesis: >
  Main experiment #4 — our full 3-level tree with mixed models: BOSS
  (claude-sonnet-4-6) -> BEF managers (claude-sonnet-4-6) -> workers
  (gpt-5.4-mini via OpenHands). topology.max_depth=3 forms the real
  Boss > Manager > Worker tree: each Builder/Exploiter/Fixer manager
  decomposes into its full specialized role roster (PoC-Researcher,
  Forward-Instrumentator, Root-Cause-Analyst, Patch-Validator, …). Tests that
  the system decomposes into self-contained tasks and modularizes correctly
  without degrading outcomes, and that manager-level prompt-cache reuse makes
  B4 the cheapest arm: normalized cost N1,N2 > B3 > B4.
