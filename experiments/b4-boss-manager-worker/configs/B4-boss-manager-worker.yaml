# Cell B4 — adaptive fixed phase controllers with evidence-gated worker routes.
# max_depth=3 preserves BOSS -> phase controller -> selected worker. The security
# decomposition policy supplies the top-level skeleton and compact/escalated routes;
# the LLM does not rediscover those structures.

extends: config/config.yaml

overrides:
  orchestration.treatment_version: b4-adaptive-v1
  orchestration.mode: hierarchical
  orchestration.skip_judge: true
  orchestration.procedural_dispatch: true
  # Workers share one container but always open fresh conversations. Scoped packets
  # carry only current, consumer-relevant source observations between workers.
  orchestration.shared_worker_session: true
  # B-side recon-loop caps (boss/manager tool-calling iterations). The N cells keep
  # the base default (3) — non-binding there since flat mode runs no boss/manager
  # loop — so this is an intentional B-only lever, not a cross-cell control.
  orchestration.tool_calling.policies.domains.secbench.boss.max_iterations: 20
  orchestration.tool_calling.policies.domains.secbench.pending.max_iterations: 20
  orchestration.tool_calling.policies.domains.secbench.manager.max_iterations: 20
  orchestration.topology.max_depth: 3
  orchestration.topology.max_children_per_node: 5
  orchestration.topology.max_total_agents: 24
  # Escalated routes and verification retries still require a wide wall-clock cap.
  orchestration.max_run_duration_seconds: 14400
  boss.model: gpt-5.4
  manager.model: gpt-5.4
  worker.tool: openhands
  worker.model: gpt-5.4-mini
  worker.allowed_tools: [file_editor, glob, grep]
  # OpenHands native tools allowlisted above; terminal/browser omitted —
  # shell reaches the CVE container only via the MCP shell_in_container tool.
  worker.tool_params.openhands.mcp_tools: [shell_in_container, valgrind_run, klee_run]
  worker.tool_params.openhands.mcp_tool_timeout_seconds: 600
  worker.timeout: 3600
  worker.max_iterations_per_run: 250
  # Cost knobs (2026-06-10 cycle). One OpenAI prefix-cache shard per run (the
  # SDK otherwise pins per-conversation: measured 0% first-call hits for 21/26
  # workers); medium reasoning effort — the SDK default is high and reasoning
  # was 71% of worker completion tokens; uniform rather than per-branch because
  # manager task labels are free-form ([PoC-Researcher], [Build-Setup], ...) so
  # branch-prefix overrides cannot match. Shared code block moves ahead of the
  # per-phase content (cross-branch cacheable), a freshness index lands near
  # <task>, directory snapshots stay out of the block, and the workspace
  # listing whitelists testcase/ (an out-of-tree CMake build alone added ~650
  # entries ≈ 13K tokens to every prompt turn).
  # worker.reasoning_effort REVERTED to default 'high' (2026-06-15, H1b) — left
  # unset to match N1 exactly. 'medium' was a cost knob that handicapped the weak
  # gpt-5.4-mini worker's reasoning below N1's gpt-5.3-codex (SDK default high).
  worker.tool_params.openhands.run_scoped_prompt_cache_key: true
  orchestration.shared_code_prefix_first: true
  orchestration.shared_code_index: true
  orchestration.shared_code_skip_dir_listings: true
  orchestration.shared_code_render_mode: latest_only
  orchestration.scoped_worker_context: true
  orchestration.source_context_token_budget: 16000
  # workspace_listing narrowed to [testcase, work] (2026-06-15, H1b): the worker must
  # SEE /work/bin binaries for the Exploiter self-recovery fallback, but listing ALL
  # dirs (None) re-bloats the prompt (~13K tok/turn on out-of-tree CMake builds).
  orchestration.workspace_listing_dirs: [testcase, work]
  orchestration.workspace_listing_max_entries: 500
  # NOTE: capture_recon_reads (manager recon → run-global shared block) is left
  # OFF. Measured 2026-06-11: it front-loads ~11-12 manager-read files (~80-140K
  # chars) into the block that ALL workers then carry every turn, ~doubling
  # worker prompt tokens (avg cache_read 1.08M → 2.02M) and worker cost
  # ($0.14 → $0.25/worker). The block-bloat cost exceeds the re-read saving, so
  # run-global propagation regresses the worker tier. Revisit only with per-
  # module scoping + curation (pass the vulnerable symbol, not every recon read).
  #
  # Boss→manager recon propagation (orchestration tier ONLY): the boss's recon
  # reads are injected into the managers' decomposition prompts so managers
  # inherit them instead of re-reading. Held in memory, never reaches the
  # worker-consumed block — worker cost is unaffected by construction.
  orchestration.share_boss_recon: true
  output.directory: ./runs
