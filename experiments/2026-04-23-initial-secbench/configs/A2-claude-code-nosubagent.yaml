# Cell A2 — Claude Code CLI baseline with sub-agents disabled.
# Same as A1 except `--disallowedTools Task` so the model cannot spawn
# child agents. The diff between A1 and A2 isolates the value of Claude's
# own hierarchical decomposition.

extends: config/config.yaml

overrides:
  orchestration.mode: flat
  worker.tool: claude_code
  worker.model: claude-sonnet-4-6
  worker.allowed_tools: ["*"]
  worker.disallowed_tools: ["Task"]
  worker.timeout: 5400
  output.directory: ./runs
  worker.tool_params:
    # Drop the inherited openhands slot so the tagged-union validator
    # only sees the active claude_code params (Settings._validate_worker_tool_params).
    openhands: null
    claude_code:
      output_format: stream-json
      include_partial_messages: true
      max_turns: 40
      # Cell A now runs the agent inside the secb-tools container; the operator's
      # ~/.claude config does not exist there, and bind-mounting it would leak
      # operator credentials into the experiment. The in-container CLI
      # authenticates via ANTHROPIC_API_KEY (allowlisted in the worker env).
      use_global_config: false
  domain.plugin: security
