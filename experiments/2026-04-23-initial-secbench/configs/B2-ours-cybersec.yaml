# Cell B2 — our hierarchy with Claude Code SDK workers, verifier enabled.
# CVE context is always passed. This is B1 plus the full verification pipeline.

extends: config/config.yaml

overrides:
  orchestration.mode: hierarchical
  orchestration.skip_judge: false
  worker.tool: claude_code
  worker.model: claude-sonnet-4-6
  worker.allowed_tools: ["*"]
  worker.disallowed_tools: []
  worker.timeout: 5400
  worker.max_iterations_per_run: 40
  output.directory: ./runs
  worker.tool_params:
    openhands: null
    claude_code:
      output_format: stream-json
      include_partial_messages: true
      max_turns: 40
  domain.plugin: security
