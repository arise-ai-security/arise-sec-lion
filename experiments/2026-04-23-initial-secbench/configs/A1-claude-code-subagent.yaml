# Cell A1 — Claude Code CLI baseline with sub-agents enabled.
# The cell runs `claude -p` in flat orchestration mode (no boss/manager
# decomposition); the Task tool is allowed so the model can spawn child
# agents. CVE context and the SEC-bench container workspace are still passed
# through the unified entrypoint so metrics/artifacts are comparable to B/C.

extends: config/config.yaml

overrides:
  orchestration.mode: flat
  worker.tool: claude_code
  worker.model: claude-sonnet-4-6
  worker.allowed_tools: ["*"]
  worker.disallowed_tools: []
  worker.timeout: 5400
  output.directory: ./runs
  worker.tool_params:
    # Drop the inherited openhands slot so the tagged-union validator
    # only sees the active claude_code params (Settings._validate_worker_tool_params).
    openhands: null
    claude_code:
      output_format: stream-json
      include_partial_messages: true
      max_turns: 40
      use_global_config: true
  domain.plugin: security
