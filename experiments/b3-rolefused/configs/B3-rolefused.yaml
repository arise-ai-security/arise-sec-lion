# Cell B3 — adaptive B4 with the phase-manager/specialist layer fused.
# BOSS -> four atomic phase workers. The treatment keeps B4's context,
# procedure, tool, budget, and model policy; only the manager/specialist
# topology is removed. This is a composite manager-plus-specialization ablation.
#
# Fused phase labels are not B4 specialist prefixes. Exploiter/Fixer/Reporter
# fused workers contain reasoning work and must use gpt-5.3-codex. Builder stays
# on the inherited gpt-5.4-mini coding/execution model.

extends: experiments/b4-boss-manager-worker/configs/B4-boss-manager-worker.yaml

overrides:
  orchestration.treatment_version: b4-adaptive-rolefused-v1
  orchestration.topology.max_depth: 2
  orchestration.topology.max_total_agents: 12
  worker.model_overrides:
    "[Exploiter]": gpt-5.3-codex
    "[Fixer]": gpt-5.3-codex
    "[Reporter]": gpt-5.3-codex
