# Cell A2 — flat Claude Code CLI with the Task sub-agent tool disallowed.
# Same setup as A1 except the model cannot spawn children, so the entire
# task collapses into a single Claude agent. A1 vs A2 isolates the value
# of Claude's native hierarchical decomposition.

extends: config/config.yaml

overrides:
  orchestration.mode: flat
  worker.tool: claude_code
  worker.model: claude-sonnet-4-6
  worker.allowed_tools: ["*"]
  worker.disallowed_tools: ["Task"]
  worker.timeout: 5400
  worker.max_iterations_per_run: 40
  output.directory: ./runs
  worker.tool_params:
    openhands: null
    claude_code:
      output_format: stream-json
      include_partial_messages: true
      max_turns: 40
      use_global_config: false
  domain.plugin: security
