# Cell A1 — flat Claude Code CLI with native sub-agents enabled.
# The model runs `claude -p` inside the secb-tools container; the Task tool
# is allowed, so Claude may decompose into its own children.

extends: config/config.yaml

overrides:
  orchestration.mode: flat
  worker.tool: claude_code
  worker.model: claude-sonnet-4-6
  worker.allowed_tools: ["*"]
  worker.disallowed_tools: []
  worker.timeout: 5400
  worker.max_iterations_per_run: 40
  output.directory: ./runs
  worker.tool_params:
    openhands: null
    claude_code:
      output_format: stream-json
      include_partial_messages: true
      max_turns: 40
      use_global_config: false
  domain.plugin: security
