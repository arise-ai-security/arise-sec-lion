study_id: 2026-05-11-fresh-start
created_at: 2026-05-11 00:00:00+00:00
hypothesis: |
  Fresh start of the SEC-bench matrix on a smoke-sized dataset. Six cells span
  three architecture × two-judge variants (A: flat Claude CLI; B: our hierarchy
  with Claude SDK workers; C: our hierarchy with Qwen/OpenHands workers) under
  shared event-metric and artifact scripts.
dataset: dataset.yaml
replicates: 1
# BUG-CR1: smoke cells stay registered (so they remain runnable for dev) but
# headline reports only aggregate the cells listed here. `collect.py` and
# `render_report.py` honor this allowlist; if absent, they fall back to all
# cells.
# BUG-A2 landed: A-cells now render a real flat prompt via
# ``SecBenchPromptStrategy.extend_flat_prompt`` (CVE context + 4-phase pipeline
# overview). A1 and A2 are restored to headline aggregates.
headline_cells: [A1, A2, B1, B2, C1, C2]
cells:
  A1: {group: A, runner: aris, config: configs/A1-claude-code-subagent.yaml}
  A2: {group: A, runner: aris, config: configs/A2-claude-code-nosubagent.yaml}
  B1: {group: B, runner: aris, config: configs/B1-ours-claude-noverifier.yaml}
  B1smoke: {group: B, runner: aris, config: configs/B1-ours-claude-noverifier-smoke.yaml}
  B2: {group: B, runner: aris, config: configs/B2-ours-claude-verifier.yaml}
  C1: {group: C, runner: aris, config: configs/C1-qwen-noverifier.yaml}
  C1smoke: {group: C, runner: aris, config: configs/C1-openhands-openai-smoke.yaml}
  C1claudesmoke: {group: C, runner: aris, config: configs/C1-openhands-claude-smoke.yaml}
  C2: {group: C, runner: aris, config: configs/C2-qwen-verifier.yaml}
