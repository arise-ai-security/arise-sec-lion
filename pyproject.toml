[project]
name = "arise-sec-lion"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "jinja2>=3.1.6",
    "litellm>=1.80.0",
    "orjson>=3.11.4",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "core/domain/tests",
    "core/application/tests",
    "infrastructure/tests",
    "presentation/tests",
    "bootstrap/tests",
]
markers = [
    "e2e: end-to-end tests (require full infrastructure)",
    "integration: integration tests (require external services)",
]
addopts = "-v --tb=short"
