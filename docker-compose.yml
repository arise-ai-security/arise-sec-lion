services:
  postgres:
    image: postgres:16-alpine
    container_name: arise-postgres
    environment:
      POSTGRES_USER: arise
      POSTGRES_PASSWORD: arise
      POSTGRES_DB: arise_events
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arise -d arise_events"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
